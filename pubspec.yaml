name: capstone_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.1
  http: ^1.6.0
  pinput: ^6.0.2
  intl: ^0.20.2
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.5
  cupertino_icons: ^1.0.6
  pedometer: ^4.1.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^7.1.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-icon.jpeg" # Path to your high-res logo
  # adaptive_icon_background: "#41B9A1"      # Your project's primary teal
